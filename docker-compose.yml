version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: banco-postgres
    environment:
      POSTGRES_DB: neo-banko
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: